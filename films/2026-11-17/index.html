:root{ --ink:#070B16; --text:#E9EEF8; --dim:#8492B0; --amber:#FFB547; --line:#2B3A66;

/* layout: a single letterboxed canvas; a programme card sits over it until a film is chosen */
html,body{height:100%;margin:0;background:#000;overflow:hidden}
#app{position:fixed;inset:0;display:grid;place-items:center;background:#000}
#app.idle{cursor:none}
#film{display:block;background:var(--ink)}
#poster,#again{position:absolute;inset:0;display:grid;place-items:center;color:var(--text)}
#poster{background:radial-gradient(ellipse at 30% 40%,#16224a 0%,#070B16 62%);overflow:auto}
#poster[hidden],#again[hidden]{display:none}
.prog{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:clamp(24px,5vw,90px);align-items:center;width:min(1500px,calc(100% - 48px));padding:24px 0}
.prog .k{font:600 clamp(11px,1.1vw,20px)/1 var(--mono);letter-spacing:.3em;color:var(--dim);margin-bottom:2vh}
.prog h1{font:800 clamp(44px,7.4vw,140px)/.95 var(--display);margin:0;letter-spacing:-.02em;text-wrap:balance}
.prog p{font:600 clamp(12px,1.25vw,22px)/1.5 var(--mono);color:var(--dim);margin:2.4vh 0 3.6vh}
button{font:inherit;color:inherit;cursor:pointer}
#play{font:800 clamp(16px,1.9vw,32px)/1 var(--display);padding:.75em 1.5em;border:0;border-radius:10px;background:var(--amber);color:#1A1206}
button:focus-visible{outline:3px solid #fff;outline-offset:4px}
button:disabled{opacity:.6;cursor:default}
.prog small{display:block;margin-top:3vh;font:500 clamp(10px,.95vw,16px)/1.6 var(--mono);color:var(--dim)}
#films{display:grid;gap:0}
.chap{display:grid;grid-template-columns:2.4em 1fr auto;gap:.9em;align-items:baseline;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:.72em .2em;font:800 clamp(16px,2.1vw,38px)/1.1 var(--display)}
.chap:last-child{border-bottom:1px solid var(--line)}
.chap:hover:not(:disabled) b{color:var(--amber)}
.chap i{font:600 .5em/1 var(--mono);font-style:normal;color:var(--amber)}
.chap span{font:500 .5em/1 var(--mono);color:var(--dim);font-variant-numeric:tabular-nums}
#again{background:rgba(4,6,12,.55)}
#againbtn{font:800 clamp(16px,1.9vw,32px)/1 var(--display);padding:.75em 1.5em;border:0;border-radius:10px;background:var(--amber);color:#1A1206}
@media (max-width:760px){.prog{grid-template-columns:1fr}}

<script>window.EDITION = {"title": "A.I. This Week", "label": "November 10 – 16, 2026 · ACG 6415", "items": [{"type": "open"}, {"type": "film", "id": "jensen"}, {"type": "film", "id": "fingerprints"}, {"type": "film", "id": "roadshow"}, {"type": "film", "id": "after2027"}, {"type": "take", "audio": "audio/takes/rec_56b4b7dee16d.mp3", "dur": 24.36, "line": "A forecast is a model. Ask what has to be true.", "who": "Professor Hornik", "about": "2027 After All?"}, {"type": "film", "id": "meeting"}, {"type": "take", "audio": "audio/takes/rec_55ebf92290e4.mp3", "dur": 21.89, "line": "The agent can now approve, record and pay. Which of those would you separate?", "who": "Professor Hornik", "about": "In the Meeting"}, {"type": "film", "id": "checked"}, {"type": "end"}], "films": {"jensen": {"title": "Jensen Is Out", "beats": [{"id": "cards", "text": "In 2012, the first great neural network was trained on two graphics cards made for video games. The company that made them was Nvidia.", "audio": "audio/jensen/cards_2d3b9f837c7c.mp3", "start": 1.6, "dur": 9.41}, {"id": "bet", "text": "Its founder, Jensen Huang, saw what that meant before almost anyone, and bet the company on it. Today nearly every frontier AI model is trained on Nvidia chips.", "audio": "audio/jensen/bet_ffb2a0724ee1.mp3", "start": 11.56, "dur": 10.8}, {"id": "out", "text": "Last Thursday, after thirty-three years, he resigned, effective immediately. The company gave no reason.", "audio": "audio/jensen/out_d514b799a0f8.mp3", "start": 22.91, "dur": 7.25}, {"id": "why", "text": "Days earlier he had publicly admitted to an affair. The board had opened a review of whether he was a target of Chinese intelligence. Beijing calls that claim baseless, and the board says it has no reason to believe national security was compromised.", "audio": "audio/jensen/why_5ec35b31b9b8.mp3", "start": 30.71, "dur": 15.86}, {"id": "drop", "text": "Since its record in October, the stock has lost about thirty percent. One point seven trillion dollars.", "audio": "audio/jensen/drop_48745bf12d37.mp3", "start": 47.12, "dur": 7.06}, {"id": "next", "text": "The chief financial officer, Colette Kress, is running the company for now. Nvidia has its first board chair. And it reports earnings today.", "audio": "audio/jensen/next_2a76b5225e80.mp3", "start": 54.73, "dur": 9.31}, {"id": "close", "text": "For thirty-three years, one man was the strategy, the salesman, and the voice in Washington. Every annual report warns about depending on a founder. This is what that sentence looks like when it comes true.", "audio": "audio/jensen/close_c61be7cccb14.mp3", "start": 64.59, "dur": 12.55}], "total": 80.19, "bed": "audio/jensen/bed.mp3"}, "fingerprints": {"title": "Fingerprints", "beats": [{"id": "file", "text": "China's AI labs give their best models away. Anyone can download one. It is a single enormous file of numbers.", "audio": "audio/fingerprints/file_87376e3ab674.mp3", "start": 1.6, "dur": 9.0}, {"id": "dice", "text": "Billions of them. And before the model learned anything, every one of those numbers was a roll of the dice.", "audio": "audio/fingerprints/dice_02c3c8e6befa.mp3", "start": 11.15, "dur": 8.71}, {"id": "chip", "text": "But computers don't really roll dice. The chip that fills in those numbers leaves a pattern. A different chip, a different pattern.", "audio": "audio/fingerprints/chip_db8d7ca9d0b2.mp3", "start": 20.41, "dur": 7.97}, {"id": "print", "text": "Training changes the numbers. It doesn't erase the pattern. It is still there, in the file the lab published.", "audio": "audio/fingerprints/print_87588181d5b3.mp3", "start": 28.93, "dur": 6.46}, {"id": "search", "text": "Last week a former OpenAI researcher, Will Depue, went looking for it. He tried six trillion combinations of chip and starting seed.", "audio": "audio/fingerprints/search_fe0062ef26d4.mp3", "start": 35.94, "dur": 9.17}, {"id": "match", "text": "Six models matched. All six pointed to the same family of chip: Blackwell. Nvidia's newest. The one that cannot legally be sold to China.", "audio": "audio/fingerprints/match_fdba72a077a9.mp3", "start": 45.66, "dur": 10.06}, {"id": "bench", "text": "He ran the test on a real one. It rebuilt a DeepSeek model's starting numbers exactly. An older chip rebuilt none. And wherever labs have named their hardware, the fingerprint was right. Twenty-four out of twenty-four.", "audio": "audio/fingerprints/bench_858e8d3ed0d2.mp3", "start": 56.27, "dur": 13.32}, {"id": "where", "text": "Here is what the fingerprint cannot tell you: where that chip was sitting. Inside China, the export ban was broken. Rented in another country, it may be legal.", "audio": "audio/fingerprints/where_f7b8f25f5727.mp3", "start": 70.14, "dur": 11.26}, {"id": "close", "text": "No leak. No insider. The evidence was in the file the whole time.", "audio": "audio/fingerprints/close_863e9829e1d6.mp3", "start": 81.95, "dur": 5.16}], "total": 90.16, "bed": "audio/fingerprints/bed.mp3"}, "roadshow": {"title": "The Roadshow", "beats": [{"id": "price", "text": "This Thursday, Anthropic is expected to start trading on the Nasdaq. Seventy to seventy-eight dollars a share.", "audio": "audio/roadshow/price_9324499e76d1.mp3", "start": 1.6, "dur": 6.55}, {"id": "raise", "text": "At the top of that range it would raise about sixty-four billion dollars, and be valued at as much as one point four trillion.", "audio": "audio/roadshow/raise_8491b77a0c57.mp3", "start": 8.7, "dur": 7.85}, {"id": "table", "text": "Now read down the page. Third-quarter revenue: seventeen billion dollars, up more than twelve times in a year. Net loss: twenty-three billion. But almost twenty-two billion of that is a non-cash charge, tied to the company's own rising valuation.", "audio": "audio/roadshow/table_a7081f2260d6.mp3", "start": 17.1, "dur": 15.6}, {"id": "slide", "text": "The roadshow video has a slide that stopped people. A curve showing how much less computing it takes to train a model, bending upward. A former employee wrote that the slide was a big factor in the decision to leave.", "audio": "audio/roadshow/slide_49e872030ca5.mp3", "start": 33.25, "dur": 14.95}, {"id": "foot", "text": "Then someone read the footnote. The placement of the data points on the graph, it says, is solely for illustrative purposes.", "audio": "audio/roadshow/foot_64465cccb981.mp3", "start": 48.75, "dur": 7.85}, {"id": "close", "text": "None of this is hidden. The loss, the adjustment, the footnote: all of it is disclosed. The skill is in the reading.", "audio": "audio/roadshow/close_1a4319808a48.mp3", "start": 57.15, "dur": 9.17}], "total": 69.37, "bed": "audio/roadshow/bed.mp3"}, "after2027": {"title": "2027 After All?", "beats": [{"id": "line", "text": "Draw a line for how fast AI is getting better. For years it has climbed at a steady pace.", "audio": "audio/after2027/line_6471e135cf4c.mp3", "start": 1.6, "dur": 7.25}, {"id": "kink", "text": "Earlier this month, outside auditors looked inside one lab, Anthropic, and found a bend. Progress there is running about twice as fast as it was. And most of that, they said, is AI doing the research.", "audio": "audio/after2027/kink_c23dc892ff17.mp3", "start": 9.4, "dur": 14.81}, {"id": "extend", "text": "Forecasters took that bend and kept drawing. If AI speeds up AI research, the line doesn't just climb. It curls upward.", "audio": "audio/after2027/extend_cb9b376abbc0.mp3", "start": 24.76, "dur": 9.72}, {"id": "date", "text": "Last week the authors of the forecast called AI 2027 moved their date. All six now expect an AI that out-researches the best humans in 2027. One of them wrote: I am scared, sad, and angry.", "audio": "audio/after2027/date_7992e269abe1.mp3", "start": 35.03, "dur": 17.11}, {"id": "ask", "text": "Then a philosopher, David Chalmers, asked a plain question. How, exactly, does twice as fast get you there?", "audio": "audio/after2027/ask_18cc5a1c8c70.mp3", "start": 52.69, "dur": 8.76}, {"id": "strands", "text": "Suppose the line is really two. An easy part: writing code, running experiments. And a hard part: knowing which experiment is worth running. The easy part can explode while the hard part barely moves.", "audio": "audio/after2027/strands_d13191b5449d.mp3", "start": 62.0, "dur": 12.55}, {"id": "sub", "text": "He calls that a sub-explosion. Fast, and real, and still short of the machine the forecasts describe.", "audio": "audio/after2027/sub_312e85fde14c.mp3", "start": 75.1, "dur": 7.15}, {"id": "wide", "text": "Now pull back far enough to see every lab at once. One analyst says the line looks the way it always has. What changed is who is in front.", "audio": "audio/after2027/wide_627ab81914b4.mp3", "start": 82.8, "dur": 9.26}, {"id": "close", "text": "Same evidence. Three ways to draw the line. Before you believe a forecast, find the assumption holding it up.", "audio": "audio/after2027/close_30b45b33dad8.mp3", "start": 92.61, "dur": 7.1}], "total": 102.76, "bed": "audio/after2027/bed.mp3"}, "meeting": {"title": "In the Meeting", "beats": [{"id": "chat", "text": "For three years the assistant lived in a chat window. You went to it.", "audio": "audio/meeting/chat_609b2c9f562b.mp3", "start": 1.6, "dur": 4.85}, {"id": "room", "text": "Last week it moved in. On Tuesday, Anthropic gave Claude a spreadsheet and a whiteboard. On Thursday, a seat in the meeting. It joins the video call, takes the notes, and builds the document while people are still talking.", "audio": "audio/meeting/room_cafda288032a.mp3", "start": 7.0, "dur": 15.96}, {"id": "store", "text": "OpenAI opened a storefront. A business can now claim its profile inside ChatGPT, and put an agent on the counter to answer customers.", "audio": "audio/meeting/store_fdce607f4458.mp3", "start": 23.51, "dur": 8.9}, {"id": "wallet", "text": "On Friday it got a wallet. The agent can complete a purchase for you, with your approval each time, without ever seeing your card number.", "audio": "audio/meeting/wallet_2d70a80f8048.mp3", "start": 32.96, "dur": 9.05}, {"id": "search", "text": "And Google switched its newest fast model on for everyone who uses Search.", "audio": "audio/meeting/search_0cb491cf5318.mp3", "start": 42.56, "dur": 6.91}, {"id": "close", "text": "Put the week together. The assistant sits in the meeting. It keeps the books. It runs the counter. It holds the means to pay. Each of those used to be a different person.", "audio": "audio/meeting/close_b25a538db08f.mp3", "start": 50.02, "dur": 10.75}], "total": 63.82, "bed": "audio/meeting/bed.mp3"}, "checked": {"title": "Checked by Machine", "beats": [{"id": "signal", "text": "Your encrypted messages may run on a system called Signal. Last week, Google DeepMind's AI wrote six million lines of mathematical proof that Signal's working code keeps its promises.", "audio": "audio/checked/signal_5402b21070eb.mp3", "start": 1.6, "dur": 12.72}, {"id": "test", "text": "Five people did it in about a month. They read the one percent that mattered. And to test the tester, they put two old bugs back in. It caught both.", "audio": "audio/checked/test_dc95c6cc3443.mp3", "start": 14.87, "dur": 10.75}, {"id": "frank", "text": "A Stanford psychologist, Michael Frank, turned the same kind of tool on himself. Fifty-eight of his own papers. Forty had at least one number that could not be reproduced. He published the results.", "audio": "audio/checked/frank_d71b4dcb76c6.mp3", "start": 26.17, "dur": 13.01}, {"id": "audit", "text": "And two weeks ago, an AI audit claimed serious flaws in the work of two famous economists. Now that audit has been audited. Of a hundred forty-seven flags, the facts held up in a hundred thirty-one, and none were wrong.", "audio": "audio/checked/audit_6e40f181e67c.mp3", "start": 39.73, "dur": 16.06}, {"id": "but", "text": "But only twenty-one change a headline number. Ninety-eight are arguments about method.", "audio": "audio/checked/but_c0a212b6aa4c.mp3", "start": 56.34, "dur": 5.35}, {"id": "close", "text": "The machine had its facts right, and its adjectives wrong. A finding and a judgment are not the same thing.", "audio": "audio/checked/close_cbba8e05e267.mp3", "start": 62.24, "dur": 7.92}], "total": 73.21, "bed": "audio/checked/bed.mp3"}}, "sting_in": "audio/sting_in.mp3", "sting_out": "audio/sting_out.mp3"};</script>
